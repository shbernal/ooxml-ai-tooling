# One install covers both package trees. `mcp/` is a workspace member purely so
# its dependencies land with the root install — it does not depend on anything
# in this repo. The core reaches it by byte-identical file copy (`make
# sync-core`), never as a package dependency, and that stays true.
#
# `skill/` is deliberately absent: it has no package.json and must keep running
# from a bare checkout with no install step at all.
packages:
  - mcp

# pnpm blocks dependency lifecycle scripts by default and fails the install
# until every one is answered here. lefthook's postinstall links its platform
# binary, so denying it would leave `pnpm exec lefthook install` failing with no
# obvious cause. It is the only dependency in this repo allowed to run one.
allowBuilds:
  lefthook: true

# Refuse a version published in the last two days, in minutes. Nothing here needs
# a release the day it ships, and the window this closes is the one between a
# compromised publish and its takedown. A runner has no user-level pnpm config,
# so the policy has to live in the repo to apply there.
minimumReleaseAge: 2880
