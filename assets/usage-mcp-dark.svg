<text x="400" y="23" text-anchor="middle" class="muted" style="font-size:12px">agent · mcp: ooxml</text>
<g class="a0"><rect x="24" y="52" width="752" height="66" rx="8" fill="#161b22" stroke="#30363d"/><text x="40" y="70" class="fg"><tspan class="muted">you</tspan></text><text x="40" y="90" class="fg">Word won't open report.docx. The validator says:</text><text x="40" y="108" class="fg"><tspan class="red">Sch_UndeclaredAttribute: The 'bogus' attribute is not declared.</tspan></text></g>
<g class="a1"><text x="24" y="150" class="fg"><tspan class="accent">●</tspan> <tspan class="muted">agent</tspan></text></g>
<g class="a2"><rect x="24" y="160" width="752" height="226" rx="8" fill="#0d1117" stroke="#30363d"/><path d="M24.5 188V168a8 8 0 0 1 8-8h735a8 8 0 0 1 8 8V188Z" fill="#161b22"/><text x="40" y="179" class="fg"><tspan class="muted">tool</tspan> <tspan class="accent">ooxml_explain</tspan><tspan class="muted">  (mcp-server-ooxml)</tspan></text><text x="40" y="208" class="fg"><tspan class="blue">id</tspan><tspan class="muted">: </tspan><tspan class="green">&quot;Sch_UndeclaredAttribute&quot;</tspan></text><text x="40" y="226" class="fg"><tspan class="blue">xpath</tspan><tspan class="muted">: </tspan><tspan class="green">&quot;/w:document[1]/w:body[1]/w:p[1]/w:pPr[1]/w:ind[1]&quot;</tspan></text><line x1="40" x2="760" y1="240" y2="240" stroke="#30363d"/></g>
<g class="run"><text x="40" y="262" class="fg"><tspan class="muted">running…</tspan></text></g>
<g class="a3"><text x="40" y="262" class="fg"><tspan class="blue">resolved</tspan><tspan class="muted">: </tspan><tspan class="green">true</tspan></text></g>
<g class="a4"><text x="40" y="280" class="fg"><tspan class="blue">finding</tspan><tspan class="muted">: </tspan><tspan class="fg">undeclared_attribute </tspan><tspan class="red">&quot;bogus&quot;</tspan></text></g>
<g class="a5"><text x="40" y="298" class="fg"><tspan class="blue">legal.resolved_from</tspan><tspan class="muted">: </tspan><tspan class="green">&quot;w:ind -&gt; w:CT_Ind&quot;</tspan></text></g>
<g class="a6"><text x="40" y="316" class="fg"><tspan class="blue">message</tspan><tspan class="muted">: </tspan><tspan class="green">&quot;The 'bogus' attribute is not allowed on w:ind. …&quot;</tspan></text></g>
<g class="a7"><text x="40" y="334" class="fg"><tspan class="blue">legal.attributes</tspan><tspan class="muted"> (12): </tspan><tspan class="fg">end endChars firstLine firstLineChars hanging hangingChars</tspan></text></g>
<g class="a8"><text x="40" y="352" class="fg"><tspan class="muted">                       </tspan><tspan class="fg">left leftChars right rightChars start startChars</tspan></text></g>
<g class="a9"><text x="40" y="370" class="fg"><tspan class="blue">firstLine</tspan><tspan class="muted">: </tspan><tspan class="fg">s:ST_TwipsMeasure</tspan><tspan class="muted">  optional</tspan></text></g>
<g class="a10"><text x="24" y="412" class="fg"><tspan class="accent">●</tspan> <tspan class="muted">agent</tspan></text></g>
<g class="a11"><text x="24" y="434" class="fg">w:bogus isn't an attribute of w:ind, so I removed it. For a first-line</text></g>
<g class="a12"><text x="24" y="452" class="fg">indent the schema allows <tspan class="green">w:firstLine=&quot;720&quot;</tspan> (twips) or <tspan class="green">&quot;0.5in&quot;</tspan>.</text></g>
</svg>
