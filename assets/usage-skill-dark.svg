<text x="400" y="23" text-anchor="middle" class="muted" style="font-size:12px">~/report-export · agent</text>
<rect x="16" y="52" width="768" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="28" y="73"><tspan class="faint">&gt; </tspan><tspan class="fg">Add a first-line indent to the paragraphs in our .docx export.</tspan></text>
<text x="28" y="94"><tspan class="faint">  </tspan><tspan class="fg">Check the schema before you write the XML.</tspan></text>
<text x="28" y="132"><tspan class="blue">● </tspan><tspan class="fg b">Skill</tspan><tspan class="muted">(ooxml-lookup)</tspan></text>
<text x="28" y="174"><tspan class="green">● </tspan><tspan class="fg b">Bash</tspan><tspan class="muted">(node scripts/ooxml.mjs attributes w:CT_Ind)</tspan></text>
<text x="44.2" y="195"><tspan class="faint">└ </tspan><tspan class="muted">12 attributes, all optional</tspan></text>
<text x="60.4" y="216"><tspan class="fg b">firstLine   </tspan><tspan class="yellow">s:ST_TwipsMeasure</tspan></text>
<text x="60.4" y="237"><tspan class="fg">hanging     </tspan><tspan class="muted">s:ST_TwipsMeasure</tspan></text>
<text x="60.4" y="258"><tspan class="fg">left        </tspan><tspan class="muted">w:ST_SignedTwipsMeasure</tspan></text>
<text x="60.4" y="279"><tspan class="faint">… 9 more</tspan></text>
<text x="28" y="321"><tspan class="green">● </tspan><tspan class="fg b">Bash</tspan><tspan class="muted">(node scripts/ooxml.mjs values s:ST_TwipsMeasure)</tspan></text>
<text x="44.2" y="342"><tspan class="faint">└ </tspan><tspan class="muted">one of</tspan></text>
<text x="60.4" y="363"><tspan class="fg">s:ST_UnsignedDecimalNumber     </tspan><tspan class="yellow">xsd:unsignedLong</tspan></text>
<text x="60.4" y="384"><tspan class="fg">s:ST_PositiveUniversalMeasure  </tspan><tspan class="yellow">[0-9]+(\.[0-9]+)?(mm|cm|in|pt|pc|pi)</tspan></text>
<text x="28" y="426"><tspan class="fg">● </tspan><tspan class="fg">firstLine takes plain twips or a number with one of six units.</tspan></text>
<text x="28" y="468"><tspan class="green">● </tspan><tspan class="fg b">Edit</tspan><tspan class="muted">(src/export/paragraph.ts)</tspan></text>
<rect x="38.2" y="474" width="739.8" height="21" rx="4" fill="#12261e"/><text x="44.2" y="489"><tspan class="green b">+ </tspan><tspan class="fg">&lt;w:ind </tspan><tspan class="blue">w:firstLine</tspan><tspan class="fg">=</tspan><tspan class="green b">&quot;0.5in&quot;</tspan><tspan class="fg">/&gt;</tspan></text>
