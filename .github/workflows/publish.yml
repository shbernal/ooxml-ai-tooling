name: publish

# Two surfaces on two registries, so two triggers:
#
#   push a v* tag     -> npm       (mcp-server-ooxml)
#   publish a release -> ClawHub   (ooxml-lookup)
#
# The split is deliberate. The npm package is the tag's content and nothing
# else, while the skill listing carries a changelog that points at the release
# page — which does not exist yet at tag-push time. `gh release create v0.0.2`
# after the tag push therefore runs the second half.
#
# Both halves are safe to run when only one applies: the npm job reads an
# already-published version off the 403 rather than failing, and the skill job
# skips when `skill/` has not changed since the previous tag or when the version
# is already on ClawHub.
#
# `workflow_dispatch` runs the gate and nothing else. Neither publish job fires
# on it: a dispatch can name any ref, including a branch, so there is no tag to
# check `mcp/package.json` against — and a publish path whose version guard does
# not apply is worse than no manual path at all. To retry a failed upload, re-run
# the tag's own workflow.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

# Uploads are not idempotent, so two runs on one ref must not overlap — and the
# second must not be *cancelled* either, since it may be the release half of a
# tag that already published to npm.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate that makes a release trustworthy. Both surfaces vendor the core and
  # the database by file copy, so a release is only correct if check-vendor
  # passed on the exact commit being released. CI runs it on main; this runs it
  # on the tag.
  verify:
    uses: ./.github/workflows/ci.yml

  publish-mcp:
    needs: verify
    # Tag pushes only. The repository guard keeps a fork that inherits this file
    # from trying to publish under our name — it would fail on OIDC, but failing
    # loudly in someone else's Actions tab is not the behaviour we want.
    if: github.event_name == 'push' && github.repository == 'shbernal/ooxml-ai-tooling'
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing (OIDC). No npm token lives in this repo, and npm
      # attaches provenance to the tarball as a side effect.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm >= 11.5.1, which is newer than what any Node
      # release line bundles today. Pinning Node alone is not enough.
      - name: Upgrade npm to a version that can publish over OIDC
        run: npm install -g npm@latest

      # The tag is the only thing a human types at release time, and nothing
      # else ties it to what gets uploaded: tagging v0.2.0 without bumping the
      # manifest would publish 0.1.0 under a v0.2.0 release.
      - name: Tag matches the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(node -p "require('./mcp/package.json').version")
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag, but mcp/package.json declares $packaged"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches mcp/package.json at $packaged"

      # `npm publish` refuses an existing version with a 403, so a re-run of a
      # release — or a tag pushed after publishing by hand — would fail the
      # workflow rather than skip. The conflict is read off the failure instead
      # of pre-checked with `npm view`, because the registry's read path lags
      # its write path by a minute or so: right after a publish, `npm view`
      # still reports the previous version, and a guard built on it would
      # conclude "not published yet" and then hit the very error it was meant
      # to avoid.
      # What actually goes up. The package is a directory of vendored copies
      # selected by `files`, so the failure mode is a missing file rather than a
      # broken one — and `npm publish` is a poor place to discover it.
      - name: What the tarball contains
        working-directory: mcp
        run: npm pack --dry-run --ignore-scripts

      # `--provenance` is explicit rather than left to npm's OIDC default, so a
      # misconfigured trusted publisher fails here instead of quietly uploading
      # an unattested tarball that looks fine until someone checks the npm page.
      - name: Publish to npm
        working-directory: mcp
        run: |
          if out=$(npm publish --provenance --ignore-scripts 2>&1); then
            echo "$out"
          elif grep -qiE 'previously published|EPUBLISHCONFLICT' <<<"$out"; then
            echo "$out"
            echo "::notice::this version is already on npm; skipping"
          else
            echo "$out"
            exit 1
          fi

  publish-skill:
    needs: verify
    if: github.event_name == 'release' && github.repository == 'shbernal/ooxml-ai-tooling'
    runs-on: ubuntu-latest
    # CLAWHUB_TOKEN is an environment secret, so without this it resolves to an
    # empty string and `auth login` fails at release time. publish-mcp is
    # deliberately not in the environment: it holds no secret, and npm's trusted
    # publisher for this package is configured without one, which a job running
    # in `release` would contradict in its OIDC claims. The environment carries
    # no protection rules — it is a secret scope, not an approval gate on a
    # release that has already been cut.
    environment: release
    permissions:
      contents: read
    env:
      SKILL_SLUG: ooxml-lookup
      # `inspect` needs a fully-qualified skill; `publish` resolves the owner
      # from the token, which is why the handle appears here and not below.
      SKILL_REF: '@shbernal/ooxml-lookup'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Pinned; ClawHub has no OIDC trusted-publishing path, so auth is a
      # long-lived token (CLAWHUB_TOKEN) rather than id-token: write.
      #
      # **Not below 0.23.3.** 0.23.1 silently omits `scripts/data/ooxml.db` from
      # the upload — 7 files instead of 8, exit 0, no warning — which shipped a
      # 0.0.3 skill that cannot answer a single query, because the database *is*
      # the skill. The version floor is the reason `Verify the upload is
      # complete` below exists: a pin protects against the bug we know about,
      # and that step protects against the next one.
      - name: Install clawhub
        run: npm install -g clawhub@0.23.3

      - name: Authenticate to ClawHub
        run: clawhub auth login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser

      # Does the registry already have exactly this skill?
      #
      # This used to be `git diff <prev tag> HEAD -- skill/`, which asks whether
      # the *tree* changed and infers the registry from it. That inference is
      # wrong in all three ways it can be: it cannot mint a first version, it
      # skips when a previous release failed to publish, and it skips when a
      # previous release published the wrong bytes — which is how 0.0.4 went out
      # with the broken 0.0.3 skill still the latest. Ask the registry directly
      # and every one of those becomes "the content differs, so publish".
      #
      # Containment, not equality: the registry adds a generated `skill-card.md`
      # that was never in `skill/`. See build/skill-manifest.mjs.
      - name: Check whether the registry already has this skill
        id: state
        run: |
          clawhub inspect "$SKILL_REF" --tag latest --files --json > /tmp/latest.json 2>/dev/null || true
          if node build/skill-manifest.mjs --verify /tmp/latest.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the published skill already matches skill/; skipping ClawHub"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ClawHub refuses to re-publish an existing version and exits non-zero, so
      # without this the whole workflow fails whenever the version is already up
      # — a re-run of a release, or a skill published by hand before the tag.
      # `inspect` exits 0 when the version exists and 1 when it does not.
      #
      # Reaching here with `changed=true` means the tag's version exists *and*
      # differs from the tree, which a bump has to resolve because a published
      # version is permanent. Say so rather than skipping quietly.
      - name: Check whether this version is already published
        id: existing
        if: steps.state.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if clawhub inspect "$SKILL_REF" --version "$version" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$SKILL_REF@$version exists but differs from skill/; a published version cannot be replaced, so fix forward with a bump"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The slug is passed explicitly because ClawHub otherwise defaults it to
      # the folder name, which would publish this as "skill". --changelog is
      # passed for the same reason: left out, the listing invents its own
      # summary.
      - name: Publish skill to ClawHub
        if: steps.state.outputs.changed == 'true' && steps.existing.outputs.published == 'false'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          clawhub skill publish skill \
            --slug "$SKILL_SLUG" \
            --version "${RELEASE_TAG#v}" \
            --name "OOXML Lookup" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "$RELEASE_TAG" \
            --source-path skill \
            --changelog "${{ github.event.release.html_url }}"

      # `publish` exiting 0 says the request succeeded, not that the artifact is
      # whole. 0.0.3 exited 0 having silently dropped the 2.2 MB database, and
      # nothing downstream noticed until someone tried to query the skill.
      #
      # So read it back. This is the only check that tests the thing users
      # actually get, and it is worth failing an otherwise-green release over: a
      # broken version cannot be withdrawn, so the alarm has to be loud enough
      # that the next release is a fix and not a surprise.
      #
      # The retry is for moderation, which takes a minute or two before the
      # version is fetchable. A version that never appears is a failure, not a
      # pass — hence the explicit exit.
      - name: Verify what the registry actually stored
        if: steps.state.outputs.changed == 'true' && steps.existing.outputs.published == 'false'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 12); do
            if clawhub inspect "$SKILL_REF" --version "$version" --files --json > /tmp/published.json 2>/dev/null; then
              node build/skill-manifest.mjs --verify /tmp/published.json
              exit $?
            fi
            echo "attempt $attempt: $version is not fetchable yet; waiting for moderation"
            sleep 20
          done
          echo "::error::$SKILL_REF@$version never became fetchable; cannot confirm what was stored"
          exit 1
